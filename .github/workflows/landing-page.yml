name: Landing Page

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/landing-page.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/landing-page.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build React landing page
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Build
        run: npm run build

      - name: Upload landing page artifact
        uses: actions/upload-artifact@v4
        with:
          name: kindle-share-landing-page
          path: site/dist
          if-no-files-found: error
