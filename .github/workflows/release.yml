name: Release macOS App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build and publish KindleShare.zip
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build app zip
        run: ./scripts/package-macos.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            dist/KindleShare.zip \
            --title "Kindle Share $TAG_NAME" \
            --notes "Download KindleShare.zip, unzip it, move KindleShare.app to /Applications, then run xattr -dr com.apple.quarantine /Applications/KindleShare.app if macOS blocks the app."
